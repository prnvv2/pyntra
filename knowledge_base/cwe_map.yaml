# Seeded vulnerability-type -> CWE mapping used by the enrichment pipeline
# (docs/DESIGN-concurrent-orchestration-and-cve-cvss.md §B.3).
#
# Keys are matched case-insensitively against a finding's `type` and, as a
# fallback, substring-matched against its title. The first matching entry wins.
# When a structured tool (e.g. nuclei `cwe-id`) already supplies a CWE, that
# always takes precedence over this table; this map is the second tier, and an
# LLM-assisted, validated lookup is the last resort.
map:
  sql-injection: [CWE-89]
  sqli: [CWE-89]
  nosql-injection: [CWE-943]
